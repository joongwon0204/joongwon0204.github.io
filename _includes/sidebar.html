<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <h1>
        <a href="{{ site.baseurl }}">
          {{ site.title }}
        </a>
      </h1>
      <p class="lead">{{ site.description }}</p>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-nav-item{% if page.url == site.baseurl %} active{% endif %}" href="{{ site.baseurl }}">Home</a>
\
      <a class="sidebar-nav-item" href="{{ site.github.repo }}">GitHub</a>

      <span class="sidebar-nav-item" style="opacity: .7;">Categories</span>
      <a class="sidebar-nav-item" href="{{ '/category/project/' | relative_url }}">Project</a>
      <a class="sidebar-nav-item" href="{{ '/category/study/' | relative_url }}">Study</a> 

    </nav>

    <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p>
  </div>
</div>
