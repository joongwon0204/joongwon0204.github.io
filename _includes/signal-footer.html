<footer class="signal-footer">
  <nav class="signal-footer__links" aria-label="Contact links">
    {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">GitHub <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">LinkedIn <span aria-hidden="true">↗</span></a>{% endif %}
    <a href="{{ '/cv/' | relative_url }}">CV <span aria-hidden="true">↗</span></a>
  </nav>
</footer>
