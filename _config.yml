author:
  avatar: "profile.png"
  name: "JoongWon Shin"
  pronouns:
  bio: "Undergraduate student in Computer Science and Engineering at Seoul National University."
  location: "Seoul, South Korea"
  employer: "Seoul National University"
  uri:
  email: "leodal@snu.ac.kr"

  academia:
  arxiv:
  googlescholar:
  inspire-hep:
  impactstory:
  orcid:
