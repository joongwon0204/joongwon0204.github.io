---
layout: page
---

{% assign key = page.category_key %}
{% assign posts = site.categories[key] %}

{% if posts and posts.size > 0 %}
  <ul>
    {% for post in posts %}
      <div class="post">
        <h1 class="post-title">
          <a href="{{ post.url }}">
            {{ post.title }}
          </a>
        </h1>
        <p>{{ post.subtitle }}</p>

        <span class="post-date">{{ post.date | date_to_string }}</span>

      </div>
    {% endfor %}
  </ul>
{% else %}
  <p>아직 글이 없음.</p>
{% endif %}
