---
layout: default
title: "study"
heading: "study"
subheading: "공부 기록"
---

{% assign cat = 'study' %}
{% assign posts = site.categories[cat] %}

{% for post in posts %}
  <a href="{{ post.url | relative_url }}">
    <div class="card post-item">
      <div class="meta">
        <span>{{ post.date | date: "%Y-%m-%d" }}</span>
        <span class="pill">{{ cat }}</span>
      </div>
      <div class="h1">{{ post.title }}</div>
      {% if post.subtitle %}<div class="subtitle">{{ post.subtitle }}</div>{% endif %}
    </div>
  </a>
{% endfor %}
