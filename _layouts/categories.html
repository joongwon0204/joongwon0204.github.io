---
layout: page
---

{% assign key = page.category_key %}
{% assign posts = site.categories[key] %}

<div style="height: 48px;"></div>

{% if posts and posts.size > 0 %}
  <ul>
    {% for post in posts %}
      <li>
        <div class="post">
          <h1 class="post-title">
            <a href="{{ post.url }}">
              {{ post.title }}
            </a>
          </h1>
          <p>{{ post.subtitle }}</p>

          <span class="post-date">{{ post.date | "%Y.%m.%d" }}</span>

        </div>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>아직 글이 없음.</p>
{% endif %}
