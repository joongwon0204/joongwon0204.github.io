<div class="topbar">
  <div>
    <div class="page-title">{{ page.heading | default: site.title }}</div>
    <div class="page-sub">{{ page.subheading | default: site.description }}</div>
  </div>

  {% if site.github_url %}
    <a class="btn" href="{{ site.github_url }}" target="_blank" rel="noopener">
      GitHub ↗
    </a>
  {% endif %}
</div>
