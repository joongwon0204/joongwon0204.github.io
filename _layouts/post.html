---
layout: default
---

<article class="card">
  <div class="meta">
    <span>{{ page.date | date: "%Y-%m-%d" }}</span>
    {% if page.categories and page.categories.size > 0 %}
      <span class="pill">{{ page.categories[0] }}</span>
    {% endif %}
  </div>

  <h1 style="margin: 10px 0 6px; font-size: 22px;">{{ page.title }}</h1>

  {% if page.subtitle %}
    <p style="margin: 0 0 14px; color: var(--muted);">{{ page.subtitle }}</p>
  {% endif %}

  <div class="subtitle" style="color: var(--text);">
    {{ content }}
  </div>
</article>
